[project]
name = "sherlock"
version = "0.4.1"
description = "Distributed inter-process locks with a choice of backend"
authors = [{ name = "Vaidik Kapoor", email = "kapoor.vaidik@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.rst"
license = "MIT"
maintainers = [
    { name = "Vaidik Kapoor", email = "kapoor.vaidik@gmail.com" },
    { name = "Judah Rand", email = "17158624+judahrand@users.noreply.github.com" },
]
keywords = ["locking"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
all = [
    "filelock>=3.7.1,<4",
    "kubernetes>=24.2.0,<25",
    "redis>=4.3.4,<5",
    "pylibmc>=1.6.1,<2",
]
filelock = ["filelock>=3.7.1,<4"]
kubernetes = ["kubernetes>=24.2.0,<25"]
redis = ["redis>=4.3.4,<5"]
etcd = ["python-etcd>=0.4.5,<0.5"]
memcached = ["pylibmc>=1.6.1,<2"]

[project.urls]
Homepage = "https://github.com/py-sherlock/sherlock"
Repository = "https://github.com/py-sherlock/sherlock"

[dependency-groups]
dev = [
    "black>=22.8.0",
    "flake8>=5.0.4",
    "isort>=5.10.1",
    "mypy>=0.981",
    "pycodestyle>=2.9.1",
    "pytest>=7.1.2",
    "pytest-cov>=3.0.0",
    "tox>=4.12.1",
    "tox-docker>=5.0.0",
    "tox-gh-actions>=3.5.0",
    "tox-uv>=1.29.0",
    "types-filelock>=3.2.7",
    "types-redis>=4.3.21",
]

[tool.uv]

[tool.hatch.build.targets.sdist]
include = ["sherlock"]

[tool.hatch.build.targets.wheel]
include = ["sherlock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
src_paths = ["sherlock", "tests"]
