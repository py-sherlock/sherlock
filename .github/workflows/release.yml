name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release to PyPi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install `uv`
        uses: astral-sh/setup-uv@v7.1.6
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
        run: |
          uv publish
